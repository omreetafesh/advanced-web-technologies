<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tirgul 2</title>
  </head>
  <body class="min-h-screen bg-gray-100 text-gray-800">
    <nav id="navbar" class="bg-gray-800"></nav>

    <main class="flex flex-col items-center justify-center gap-4 p-10 text-center">
      <h1 id="homeTitle" class="text-3xl font-bold">Welcome to Tirgul 2</h1>
      <a href="/src/login.html" id="loginLink" class="rounded-lg bg-blue-600 px-6 py-2 font-semibold text-white hover:bg-blue-700">Login</a>
    </main>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (user) {
        document.getElementById("homeTitle").textContent = `Hello ${user.username}`;
        document.getElementById("loginLink").classList.add("hidden");
      }
    </script>
  </body>
</html>
