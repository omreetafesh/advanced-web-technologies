<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link href="dist/output.css" rel="stylesheet" />
</head>
<body class="flex min-h-screen items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-sm rounded-xl bg-white p-8 text-center shadow-md">
    <h1 id="homeTitle" class="mb-4 text-2xl font-bold text-gray-800">Home</h1>
    <div id="guestLinks" class="flex justify-center gap-3">
      <a href="login.html" class="rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700">Login</a>
      <a href="register.html" class="rounded-lg border border-blue-600 px-4 py-2 font-semibold text-blue-600 hover:bg-blue-50">Register</a>
    </div>
    <button id="logoutBtn" class="hidden rounded-lg bg-red-500 px-4 py-2 font-semibold text-white hover:bg-red-600">Logout</button>
  </div>
  <script src="js/storage.js"></script>
  <script>
    const user = getLoggedInUser();
    if (user) {
      document.getElementById("homeTitle").textContent = `Hello ${user.username}`;
      document.getElementById("guestLinks").classList.add("hidden");
      const btn = document.getElementById("logoutBtn");
      btn.classList.remove("hidden");
      btn.addEventListener("click", logout);
    }
  </script>
</body>
</html>
