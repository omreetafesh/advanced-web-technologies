<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link href="dist/output.css" rel="stylesheet" />
</head>
<body class="flex min-h-screen items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-sm rounded-xl bg-white p-8 shadow-md">
    <h1 class="mb-6 text-center text-2xl font-bold text-gray-800">Login</h1>
    <form id="loginForm" class="space-y-4">
      <input id="username" type="text" placeholder="Username" class="w-full rounded-lg border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <input id="password" type="password" placeholder="Password" class="w-full rounded-lg border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <button type="submit" class="w-full rounded-lg bg-blue-600 py-2 font-semibold text-white hover:bg-blue-700">Login</button>
      <p id="loginMessage" class="text-sm text-red-600"></p>
    </form>
    <p class="mt-4 text-center text-sm text-gray-600">No account yet? <a href="register.html" class="text-blue-600 hover:underline">Register</a></p>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
