<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body class="min-h-screen bg-gray-100 text-gray-800">
    <nav id="navbar" class="bg-gray-800"></nav>

    <div class="flex justify-center p-4 pt-16">
      <div class="w-full max-w-sm rounded-xl bg-white p-8 shadow-md">
        <h1 class="mb-6 text-center text-2xl font-bold">Login</h1>
        <form id="loginForm" action="/src/login" method="post" class="space-y-4">
          <div>
            <label for="userInput" class="mb-1 block text-sm font-medium">Username or Email</label>
            <input id="userInput" type="text" required class="w-full rounded-lg border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label for="passInput" class="mb-1 block text-sm font-medium">Password</label>
            <input id="passInput" type="password" required class="w-full rounded-lg border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <button type="submit" class="w-full rounded-lg bg-blue-600 py-2 font-semibold text-white hover:bg-blue-700">Login</button>
          <a href="#" class="block text-right mt-4 text-blue-500 hover:underline" onclick="alert('Forgot password functionality to be implemented.');">Forgot Password?</a>
        </form>
        <div id="loginMessage" class="mt-2 text-red-500 text-center text-sm"></div>
        <p class="mt-4 text-center text-sm text-gray-600">No account yet? <a href="/src/register.html" class="text-blue-600 hover:underline">Register</a></p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="login.js"></script>
  </body>
</html>
